
name: Terraform CI-CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/devops

permissions:
  contents: read

jobs:
  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t infra-as-code-pipeline:${{ github.sha }} ./app

  ecr-push:
    name: Push Image to Amazon ECR
    if: github.event_name == 'push'
    needs: [terraform-check, docker-build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: infra-as-code-pipeline
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./app
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  terraform-plan-dev:
    name: Terraform Plan - Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/devops'
    needs: ecr-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform backend
        run: terraform -chdir=terraform init

      - name: Select dev workspace
        run: |
          terraform -chdir=terraform workspace select dev || \
          terraform -chdir=terraform workspace new dev

      - name: Terraform Plan
        env:
          IMAGE_URI: ${{ needs.ecr-push.outputs.image_uri }}
        run: |
          terraform -chdir=terraform plan \
            -var-file="environments/dev/dev.tfvars" \
            -var="container_image=$IMAGE_URI"

  
  terraform-plan-staging:
    name: Terraform Plan - Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/devops'
    needs: ecr-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform -chdir=terraform init

      - name: Select staging workspace
        run: |
          terraform -chdir=terraform workspace select staging || \
          terraform -chdir=terraform workspace new staging

      - name: Terraform Plan
        env:
          IMAGE_URI: ${{ needs.ecr-push.outputs.image_uri }}
        run: |
          terraform -chdir=terraform plan \
            -var="aws_region=us-east-1" \
            -var="project_name=infra-as-code-pipeline" \
            -var="container_image=$IMAGE_URI" \
            -var-file="environments/staging/staging.tfvars"
  
  terraform-plan-prod:
    name: Terraform Plan - Production (Approval)
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/devops'
    needs: [ecr-push, terraform-plan-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Select production workspace
        run: |
          terraform -chdir=terraform workspace select prod || \
          terraform -chdir=terraform workspace new prod

      - name: Terraform Plan
        env:
          IMAGE_URI: ${{ needs.ecr-push.outputs.image_uri }}
        run: |
          terraform -chdir=terraform plan \
            -var="aws_region=us-east-1" \
            -var="project_name=infra-as-code-pipeline" \
            -var="container_image=$IMAGE_URI" \
            -var-file="environments/prod/prod.tfvars"
  
  terraform-deploy-dev:
    name: Deploy Dev to ECS
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/devops'
    needs: [ecr-push, terraform-plan-dev]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform -chdir=terraform init

      - name: Select dev workspace
        run: terraform -chdir=terraform workspace select dev

      - name: Deploy Dev
        env:
          IMAGE_URI: ${{ needs.ecr-push.outputs.image_uri }}
        run: |
          terraform -chdir=terraform apply \
            -auto-approve \
            -var-file="environments/dev/dev.tfvars" \
            -var="container_image=$IMAGE_URI"

  
  terraform-deploy-staging:
    name: Deploy Staging to ECS
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/devops'
    needs: [ecr-push, terraform-plan-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Select staging workspace
        run: terraform -chdir=terraform workspace select staging

      - name: Deploy Staging
        env:
          IMAGE_URI: ${{ needs.ecr-push.outputs.image_uri }}
        run: |
          terraform -chdir=terraform apply \
            -auto-approve \
            -var-file="environments/staging/staging.tfvars" \
            -var="container_image=$IMAGE_URI"

  terraform-deploy-prod:
    name: Deploy Production to ECS
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/devops'
    needs: [ecr-push, terraform-plan-prod, terraform-deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Select production workspace
        run: terraform -chdir=terraform workspace select prod

      - name: Deploy Production
        env:
          IMAGE_URI: ${{ needs.ecr-push.outputs.image_uri }}
        run: |
          terraform -chdir=terraform apply \
            -auto-approve \
            -var-file="environments/prod/prod.tfvars" \
            -var="container_image=$IMAGE_URI"
