
name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/devops

jobs:
  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

  
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t infra-as-code-pipeline:${{ github.sha }} ./app
  
  
  ecr-push:
    name: Push Docker Image to Amazon ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC context
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_EVENT: ${{ github.event_name }}
          GH_ACTOR: ${{ github.actor }} 
        run: |
          echo "Repository: $GH_REPOSITORY"
          echo "Ref: $GH_REF"
          echo "Event: $GH_EVENT"
          echo "Actor: $GH_ACTOR"
      
      - name: Debug OIDC claims
        run: |
          python - <<'PY'
          import os, json, urllib.request, base64
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          )
          with urllib.request.urlopen(req) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          print("Issuer:", claims.get("iss"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity